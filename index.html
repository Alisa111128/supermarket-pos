<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1677ff">
  <title>小超市扫码收银</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-title" id="topbar-title">扫码收银</div>
    <div class="topbar-actions">
      <button class="btn-icon" id="btn-settings" title="设置">⚙️</button>
    </div>
  </header>

  <main class="main" id="main-content"></main>

  <nav class="bottom-nav">
    <div class="bn-item active" data-view="pos">
      <span class="bn-icon">🛒</span>
      <span class="bn-label">收银</span>
    </div>
    <div class="bn-item" data-view="products">
      <span class="bn-icon">📦</span>
      <span class="bn-label">商品</span>
    </div>
    <div class="bn-item" data-view="stock">
      <span class="bn-icon">📊</span>
      <span class="bn-label">库存</span>
    </div>
    <div class="bn-item" data-view="records">
      <span class="bn-icon">📋</span>
      <span class="bn-label">记录</span>
    </div>
    <div class="bn-item" data-view="stats">
      <span class="bn-icon">📈</span>
      <span class="bn-label">统计</span>
    </div>
  </nav>
</div>

<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal-box" id="modal-box"></div>
</div>

<div class="toast" id="toast" style="display:none"></div>

<script src="./html5-qrcode.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
